name: Windows Verify

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Windows / pnpm verify
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      # 必须早于 checkout：golden 契约需要保留仓库原有行尾字节。
      - name: Preserve repository line endings
        run: git config --global core.autocrlf false

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js and npm cache
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/desktop/frontend/package-lock.json

      - name: Set up pnpm and store cache
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 9.15.4
          run_install: false
          cache: true
          cache_dependency_path: pnpm-lock.yaml

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Install desktop frontend dependencies
        run: npm --prefix apps/desktop/frontend ci

      - name: Install Chromium for browser regressions
        run: npx playwright install chromium

      - name: Run all eight verification gates
        run: pnpm verify

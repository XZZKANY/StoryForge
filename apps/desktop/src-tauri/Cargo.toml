[package]
name = "storyforge-desktop"
version = "0.2.1"
description = "StoryForge 桌面写作 IDE"
authors = ["StoryForge Team"]
edition = "2021"
default-run = "storyforge-desktop"

[[bin]]
name = "storyforge-desktop"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2.0", features = [] }

[dependencies]
tauri = { version = "2.3", features = [] }
tauri-plugin-dialog = "2.0"
tauri-plugin-http = "=2.6.1"
tauri-plugin-sql = { version = "=2.4.1", features = ["sqlite"] }
sqlx = { version = "=0.8.6", default-features = false, features = ["sqlite", "runtime-tokio"] }
tauri-plugin-single-instance = "2.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.11", features = ["blocking"] }
anyhow = "1.0"
walkdir = "2.5"
chrono = "0.4"
base64 = "0.22"
sha2 = "0.10"
tempfile = "3"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security_Cryptography"] }

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

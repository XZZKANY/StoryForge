[package]
name = "storyforge-desktop"
version = "0.1.10"
description = "StoryForge 桌面写作 IDE"
authors = ["StoryForge Team"]
edition = "2021"
default-run = "storyforge-desktop"

[[bin]]
name = "storyforge-desktop"
path = "src/main.rs"

[[bin]]
name = "storyforge-gui-fixture"
path = "src/main.rs"
required-features = ["gui-fixture"]

[build-dependencies]
tauri-build = { version = "2.0", features = [] }

[dependencies]
tauri = { version = "2.3", features = [] }
tauri-plugin-shell = "2.0"
tauri-plugin-dialog = "2.0"
tauri-plugin-single-instance = "2.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.11", features = ["blocking"] }
anyhow = "1.0"
ctrlc = "3.4"
walkdir = "2.5"
chrono = "0.4"
base64 = "0.22"
sha2 = "0.10"
tempfile = "3"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security_Cryptography", "Win32_System_JobObjects", "Win32_System_Threading"] }

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
gui-fixture = []
